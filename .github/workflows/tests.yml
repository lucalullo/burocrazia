name: Test locali
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pytest -q
      - run: python scripts/init_db.py
      - run: python scripts/verify_catalog.py
      - run: python scripts/benchmark.py --output benchmark-results.json
      - run: python -m compileall -q src maintenance benchmarks app.py run.py
      - run: python -m benchmarks.evaluate --fast --output-dir benchmark-release-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmarks-${{ matrix.os }}
          path: |
            benchmark-results.json
            benchmark-release-results/
